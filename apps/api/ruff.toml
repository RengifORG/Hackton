# Lint/format de la API. `uv run ruff check .` debe quedar limpio en cada fase.
target-version = "py312"
line-length = 100
src = ["app", "tests"]

[lint]
# E/W pycodestyle · F pyflakes · I isort · B bugbear · UP pyupgrade · N pep8-naming
# SIM simplificaciones · T20 prohíbe print (usar logging, CLAUDE.md §3)
select = ["E", "W", "F", "I", "B", "UP", "N", "SIM", "T20"]

[lint.isort]
known-first-party = ["app"]

[format]
quote-style = "double"
