openapi: 3.1.0
info:
  title: BYD Ecuador Lead Agent API
  version: 0.2.0
  description: Contrato único entre web (React) y api (FastAPI). Cambios solo vía PR etiquetado `contract`.
servers:
  - url: http://localhost:8000
    description: local
paths:
  /health:
    get:
      operationId: health
      responses:
        "200": { description: ok }

  /models:
    get:
      operationId: listModels
      responses:
        "200":
          description: Catálogo público
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ModelSummary" }
  /models/{modelId}:
    get:
      operationId: getModel
      parameters:
        - { name: modelId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Model" }
        "404": { $ref: "#/components/responses/NotFound" }

  /leads:
    post:
      operationId: createLead
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LeadCreate" }
      responses:
        "201":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Lead" }
        "422": { $ref: "#/components/responses/Validation" }
        "429": { $ref: "#/components/responses/RateLimited" }
    get:
      operationId: listLeads
      description: Solo para mockup de asesor. En prod requeriría auth. Nunca expone el teléfono completo.
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/LeadRead" }

  /recommendations:
    post:
      operationId: recommend
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [profile]
              properties:
                profile: { type: string, minLength: 5, maxLength: 500 }
                sessionId: { type: string }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    minItems: 3
                    maxItems: 3
                    items: { $ref: "#/components/schemas/Recommendation" }
        "422": { $ref: "#/components/responses/Validation" }

  /chat:
    post:
      operationId: chat
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChatRequest" }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatResponse" }
        "422": { $ref: "#/components/responses/Validation" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /availability:
    get:
      operationId: availability
      parameters:
        - { name: type, in: query, required: true, schema: { $ref: "#/components/schemas/AppointmentType" } }
        - { name: date, in: query, required: true, schema: { type: string, format: date } }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Slot" }

  /appointments:
    post:
      operationId: createAppointment
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AppointmentCreate" }
      responses:
        "201":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Appointment" }
        "409": { description: Slot ya ocupado }
        "422": { $ref: "#/components/responses/Validation" }
    get:
      operationId: listAppointments
      parameters:
        - { name: type, in: query, required: false, schema: { $ref: "#/components/schemas/AppointmentType" } }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Appointment" }

components:
  responses:
    NotFound: { description: No encontrado }
    Validation: { description: Error de validación }
    RateLimited: { description: Demasiadas solicitudes }
  schemas:
    AppointmentType:
      type: string
      enum: [test_drive, service]
    Hotspot:
      type: string
      enum: [wheels, seats, screen, battery, trunk, lights]
    ModelSummary:
      type: object
      required: [id, name, price, segment, rangeKm, thumbnail]
      properties:
        id: { type: string }
        name: { type: string }
        price: { type: number }
        segment: { type: string }
        rangeKm: { type: integer }
        thumbnail: { type: string }
        has3d: { type: boolean }
    Model:
      allOf:
        - $ref: "#/components/schemas/ModelSummary"
        - type: object
          properties:
            specs: { type: object, additionalProperties: true }
            hotspots:
              type: array
              items:
                type: object
                required: [id, label, position]
                properties:
                  id: { $ref: "#/components/schemas/Hotspot" }
                  label: { type: string }
                  position: { type: array, items: { type: number }, minItems: 3, maxItems: 3 }
    LeadCreate:
      type: object
      additionalProperties: false
      required: [name, phone, source, consent]
      properties:
        name: { type: string, minLength: 2, maxLength: 80 }
        phone: { type: string, pattern: "^(\\+593|0)9\\d{8}$" }
        email: { type: string, format: email }
        source: { type: string, enum: [web, whatsapp] }
        interest: { type: string, maxLength: 200 }
        recommendedModels: { type: array, items: { type: string }, maxItems: 3 }
        consent: { type: boolean, const: true }
        sessionId: { type: string }
    Lead:
      allOf:
        - $ref: "#/components/schemas/LeadCreate"
        - type: object
          required: [id, createdAt, afterHours]
          properties:
            id: { type: string }
            createdAt: { type: string, format: date-time }
            afterHours: { type: boolean }
            crmStatus: { type: string, enum: [pending, pushed, failed] }
    LeadRead:
      description: Vista de lectura para asesores. Teléfono siempre enmascarado (09****1234).
      type: object
      additionalProperties: false
      required: [id, name, phoneMasked, source, createdAt, afterHours]
      properties:
        id: { type: string }
        name: { type: string }
        phoneMasked: { type: string, pattern: "^09\\*{4}\\d{4}$", example: "09****1234" }
        source: { type: string, enum: [web, whatsapp] }
        interest: { type: string, maxLength: 200 }
        recommendedModels: { type: array, items: { type: string }, maxItems: 3 }
        createdAt: { type: string, format: date-time }
        afterHours: { type: boolean }
        crmStatus: { type: string, enum: [pending, pushed, failed] }
    Recommendation:
      type: object
      required: [modelId, name, price, reason]
      properties:
        modelId: { type: string }
        name: { type: string }
        price: { type: number }
        reason: { type: string, maxLength: 200 }
    ChatRequest:
      type: object
      additionalProperties: false
      required: [sessionId, message]
      properties:
        sessionId: { type: string, minLength: 8, maxLength: 64 }
        message: { type: string, minLength: 1, maxLength: 1000 }
        modelId: { type: string }
    ChatResponse:
      type: object
      required: [reply, suggestedActions]
      properties:
        reply: { type: string }
        suggestedActions:
          type: array
          items:
            type: string
            enum: [recommend, leave_contact, book_test_drive, book_service, view_3d]
        hotspot: { $ref: "#/components/schemas/Hotspot" }
    Slot:
      type: object
      required: [id, start, end, location, available]
      properties:
        id: { type: string }
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
        location: { type: string }
        available: { type: boolean }
    AppointmentCreate:
      type: object
      additionalProperties: false
      required: [leadId, type, slotId]
      properties:
        leadId: { type: string }
        type: { $ref: "#/components/schemas/AppointmentType" }
        slotId: { type: string }
        vehicle: { type: string, maxLength: 80 }
        notes: { type: string, maxLength: 300 }
    Appointment:
      allOf:
        - $ref: "#/components/schemas/AppointmentCreate"
        - type: object
          required: [id, status, createdAt, slot]
          properties:
            id: { type: string }
            status: { type: string, enum: [confirmed, cancelled] }
            createdAt: { type: string, format: date-time }
            slot: { $ref: "#/components/schemas/Slot" }
            leadName: { type: string }
            leadPhoneMasked: { type: string }
